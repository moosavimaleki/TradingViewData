name: Collect Market Data (tvdatafeed)

on:
  schedule:
    - cron: "0 */6 * * *"
    - cron: "0 1-5,7-11,13-17,19-23 * * *"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Run mode: auto|major|minor"
        required: true
        default: "auto"
      config_path:
        description: "Path to jobs config"
        required: true
        default: "config/collect_jobs.json"
      data_root:
        description: "Output data root"
        required: true
        default: "data"
      overlap_bars:
        description: "Overlap bars for regular time-based candles"
        required: true
        default: "30"
      range_overlap_bars:
        description: "Maximum range tail eligible for a source-guarded update; older history stays frozen"
        required: true
        default: "300"
      initial_bars:
        description: "Bars to fetch on first run (no existing file)"
        required: true
        default: "5000"
      max_bars:
        description: "Maximum bars per symbol/timeframe request"
        required: true
        default: "5000"

concurrency:
  group: tvdatafeed-collector
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RAW_ROOT: ${{ format('{0}/raw', github.event.inputs.data_root || 'data') }}
      TZ: UTC

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin RUN_YEAR (UTC)
        run: |
          set -euo pipefail
          YEAR="$(date -u +%Y)"
          RUN_DATE_UTC="$(date -u +%F)"
          RUN_TS_UTC="$(date -u +%FT%TZ)"
          RUN_STAMP_UTC="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          echo "RUN_YEAR=$YEAR" >> "$GITHUB_ENV"
          echo "RUN_DATE_UTC=$RUN_DATE_UTC" >> "$GITHUB_ENV"
          echo "RUN_TS_UTC=$RUN_TS_UTC" >> "$GITHUB_ENV"
          echo "RUN_STAMP_UTC=$RUN_STAMP_UTC" >> "$GITHUB_ENV"
          echo "Pinned RUN_YEAR=$YEAR"

      - name: Resolve run mode and effective config
        run: |
          set -euo pipefail
          BASE_CONFIG_PATH="${{ github.event.inputs.config_path || 'config/collect_jobs.json' }}"
          EVENT_NAME="${{ github.event_name }}"
          EVENT_SCHEDULE="${{ github.event.schedule || '' }}"
          INPUT_MODE="${{ github.event.inputs.run_mode || 'auto' }}"
          HOUR_UTC="$(date -u +%H)"

          RUN_MODE="auto"
          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$EVENT_SCHEDULE" = "0 */6 * * *" ]; then
              RUN_MODE="major"
            elif [ "$EVENT_SCHEDULE" = "0 1-5,7-11,13-17,19-23 * * *" ]; then
              RUN_MODE="minor"
            fi
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_MODE" != "auto" ]; then
            RUN_MODE="$INPUT_MODE"
          fi

          if [ "$RUN_MODE" = "auto" ]; then
            if [ $((10#$HOUR_UTC % 6)) -eq 0 ]; then
              RUN_MODE="major"
            else
              RUN_MODE="minor"
            fi
          fi

          if [ "$RUN_MODE" = "major" ]; then
            EFFECTIVE_CONFIG_PATH="$BASE_CONFIG_PATH"
            echo "mode=major. all timeframes enabled."
          else
            EFFECTIVE_CONFIG_PATH="$(mktemp /tmp/collect_jobs_minor.XXXXXX.json)"
            python -c 'import json,sys; src,dst=sys.argv[1:3]; keep={"10R","100R","1000R"}; d=json.load(open(src,encoding="utf-8")); jobs=d.get("jobs",[]); filtered=[j for j in jobs if str(j.get("source","")).strip().lower() in {"tradingview","tv"} and str(j.get("timeframe","")).strip().upper() in keep]; d["jobs"]=filtered; open(dst,"w",encoding="utf-8").write(json.dumps(d,ensure_ascii=False,indent=2)); print(f"mode=minor jobs={len(filtered)} output={dst}")' "$BASE_CONFIG_PATH" "$EFFECTIVE_CONFIG_PATH"
            echo "mode=minor. only 10R/100R/1000R will run."
          fi

          echo "BASE_CONFIG_PATH=$BASE_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "EFFECTIVE_CONFIG_PATH=$EFFECTIVE_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "RUN_MODE=$RUN_MODE" >> "$GITHUB_ENV"
          echo "RUN_HOUR_UTC=$HOUR_UTC" >> "$GITHUB_ENV"
          echo "RUN_EVENT_NAME=$EVENT_NAME" >> "$GITHUB_ENV"
          echo "RUN_EVENT_SCHEDULE=$EVENT_SCHEDULE" >> "$GITHUB_ENV"
          echo "Resolved RUN_MODE=$RUN_MODE EVENT_NAME=$EVENT_NAME EVENT_SCHEDULE=$EVENT_SCHEDULE RUN_HOUR_UTC=$HOUR_UTC config=$EFFECTIVE_CONFIG_PATH"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          for i in 1 2 3; do
            if pip install -r requirements.txt; then
              break
            fi
            if [ "$i" -eq 3 ]; then
              exit 1
            fi
            sleep 5
          done

      - name: Install rclone (required for raw backup)
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          set -euo pipefail
          if [ -n "${RCLONE_CONF:-}" ]; then
            sudo apt-get update
            sudo apt-get install -y rclone
          else
            echo "::error::RCLONE_CONF is required to preserve raw data before publishing updates."
            exit 1
          fi

      - name: Configure rclone (OAuth)
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          GDRIVE_REMOTE_PATH: ${{ vars.GDRIVE_REMOTE_PATH }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONF:-}" ]; then
            echo "::error::RCLONE_CONF is required for raw backups."
            exit 1
          fi

          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          echo "RCLONE_ENABLED=1" >> "$GITHUB_ENV"
          echo "RCLONE_REMOTE_PATH=${GDRIVE_REMOTE_PATH:-gdrive:market-data}" >> "$GITHUB_ENV"

      - name: Validate Drive write access (optional)
        run: |
          set -euo pipefail
          if [ "${RCLONE_ENABLED:-0}" != "1" ]; then
            echo "rclone not configured. Skipping write check."
            exit 0
          fi
          PROBE_FILE="$(mktemp)"
          PROBE_REMOTE="${RCLONE_REMOTE_PATH%/}/.write_probe.txt"
          echo "probe $(date -u +%FT%TZ)" > "$PROBE_FILE"
          if ! OUT="$(rclone copyto "$PROBE_FILE" "$PROBE_REMOTE" -v 2>&1)"; then
            echo "$OUT"
            echo "::error::Drive write check failed. Verify RCLONE_CONF and destination permissions."
            exit 1
          fi
          rclone deletefile "$PROBE_REMOTE" -v || true

      - name: Pull previous tvdatafeed files from Drive (optional)
        run: |
          set -euo pipefail
          if [ "${RCLONE_ENABLED:-0}" != "1" ]; then
            echo "rclone not configured. Skipping pull."
            printf '%s\n' "{\"status\":\"skipped\",\"reason\":\"rclone not configured\",\"run_year\":${RUN_YEAR},\"expected_count\":0,\"listed_count\":0,\"pulled_count\":0,\"remote_absent_count\":0,\"copy_missing_count\":0,\"failed_count\":0,\"pulled_files\":[],\"remote_absent_files\":[],\"copy_missing_files\":[],\"failed_files\":[]}" > tvdatafeed_pull.json
            exit 0
          fi

          CONFIG_PATH="${EFFECTIVE_CONFIG_PATH}"
          DATA_ROOT="${{ github.event.inputs.data_root || 'data' }}"

          mkdir -p "$DATA_ROOT/tradingview"
          python scripts/pull_year_parquets.py \
            --remote "${RCLONE_REMOTE_PATH%/}/data" \
            --local-root "$DATA_ROOT" \
            --config "$CONFIG_PATH" \
            --run-year "$RUN_YEAR" \
            --retries 5 \
            --retry-delay 6 \
            --out-json tvdatafeed_pull.json \
            --verbose

      - name: Run simple tvdatafeed collector
        id: collect
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail

          CONFIG_PATH="${EFFECTIVE_CONFIG_PATH}"
          DATA_ROOT="${{ github.event.inputs.data_root || 'data' }}"
          OVERLAP_BARS="${{ github.event.inputs.overlap_bars || '30' }}"
          RANGE_OVERLAP_BARS="${{ github.event.inputs.range_overlap_bars || '300' }}"
          INITIAL_BARS="${{ github.event.inputs.initial_bars || '5000' }}"
          MAX_BARS="${{ github.event.inputs.max_bars || '5000' }}"

          python collector/simple_tvdatafeed_collector.py \
            --config "$CONFIG_PATH" \
            --data-root "$DATA_ROOT" \
            --raw-root "$RAW_ROOT" \
            --overlap-bars "$OVERLAP_BARS" \
            --range-overlap-bars "$RANGE_OVERLAP_BARS" \
            --range-source-policy protect --range-fallback missing-only \
            --range-reference-bars 10000 \
            --initial-bars "$INITIAL_BARS" \
            --max-bars "$MAX_BARS" \
            | tee tvdatafeed_summary.json

      - name: Restore previous range quality observations
        id: pull_quality_state
        if: always() && steps.collect.outcome != 'skipped' && steps.collect.outcome != ''
        continue-on-error: true
        run: |
          set -euo pipefail
          DATA_ROOT="${{ github.event.inputs.data_root || 'data' }}"
          mkdir -p "$DATA_ROOT/range_quality_state"
          rclone copy "${RCLONE_REMOTE_PATH%/}/range_quality_state" "$DATA_ROOT/range_quality_state" \
            --include '**/latest.parquet' --retries 2 --stats 15s

      - name: Audit source resolution and export contiguous range candidates
        id: range_quality
        if: always() && steps.collect.outcome != 'skipped' && steps.collect.outcome != ''
        env:
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: |
          set -euo pipefail
          DATA_ROOT="${{ github.event.inputs.data_root || 'data' }}"
          python scripts/audit_range_sources.py \
            --collect-summary tvdatafeed_summary.json \
            --allow-network --reference-bars 10000 \
            --config "$EFFECTIVE_CONFIG_PATH" --raw-root "$RAW_ROOT" \
            --output "$DATA_ROOT/range_quality" \
            --state-root "$DATA_ROOT/range_quality_state" \
            --summary range_source_summary.json --report range_source_report.md
          cat range_source_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Seal and verify raw archive (also after collector failure)
        id: seal_raw
        if: always() && steps.collect.outcome != 'skipped' && steps.collect.outcome != ''
        run: |
          set -euo pipefail
          python scripts/finalize_raw_archive.py --raw-root "$RAW_ROOT"

      - name: Upload immutable raw archive to Drive
        id: push_raw
        if: always() && steps.seal_raw.outcome == 'success' && env.RCLONE_ENABLED == '1'
        run: |
          set -euo pipefail
          RAW_REMOTE="${RCLONE_REMOTE_PATH%/}/raw"
          echo "Preserving raw archives: $RAW_ROOT -> $RAW_REMOTE"
          rclone copy "$RAW_ROOT" "$RAW_REMOTE" \
            --include '**/data.parquet' --include '**/manifest.json' \
            --immutable --checksum --stats 15s -v
          rclone check "$RAW_ROOT" "$RAW_REMOTE" --one-way \
            --include '**/data.parquet' --include '**/manifest.json' -v

      - name: Preserve raw files as recovery artifact if Drive backup failed
        if: always() && steps.collect.outcome != 'skipped' && steps.collect.outcome != '' && steps.push_raw.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: raw-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RAW_ROOT }}
          compression-level: 0
          retention-days: 30
          if-no-files-found: warn

      - name: Upload immutable range evidence and candidate blocks to Drive
        if: always() && steps.push_raw.outcome == 'success' && steps.range_quality.outcome == 'success'
        run: |
          set -euo pipefail
          DATA_ROOT="${{ github.event.inputs.data_root || 'data' }}"
          rclone copy "$DATA_ROOT/range_quality" "${RCLONE_REMOTE_PATH%/}/range_quality" \
            --immutable --checksum --stats 15s
          rclone check "$DATA_ROOT/range_quality" "${RCLONE_REMOTE_PATH%/}/range_quality" --one-way
          rclone copy "$DATA_ROOT/range_quality_state" "${RCLONE_REMOTE_PATH%/}/range_quality_state" \
            --checksum --stats 15s

      - name: Preserve primary-write decisions and separate M1 fallback blocks
        id: push_range_guard
        if: always() && steps.push_raw.outcome == 'success'
        run: |
          set -euo pipefail
          DATA_ROOT="${{ github.event.inputs.data_root || 'data' }}"
          mkdir -p "$DATA_ROOT/range_guard"
          if ! python -c 'from pathlib import Path; import sys; sys.exit(0 if any(p.is_file() for p in Path(sys.argv[1]).rglob("*")) else 1)' "$DATA_ROOT/range_guard"; then
            echo "No range-write decisions were produced; no guard files to upload."
            exit 0
          fi
          rclone copy "$DATA_ROOT/range_guard" "${RCLONE_REMOTE_PATH%/}/range_guard" \
            --immutable --checksum --stats 15s
          rclone check "$DATA_ROOT/range_guard" "${RCLONE_REMOTE_PATH%/}/range_guard" --one-way

      - name: Upload range source report (major and minor)
        if: always() && steps.collect.outcome != 'skipped' && steps.collect.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: range-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            range_source_summary.json
            range_source_report.md
            ${{ github.event.inputs.data_root || 'data' }}/range_quality
            ${{ github.event.inputs.data_root || 'data' }}/range_guard
          if-no-files-found: warn
          retention-days: 30

      - name: Build detailed report artifacts
        if: always() && env.RUN_MODE == 'major'
        run: |
          set -euo pipefail
          if [ ! -f tvdatafeed_summary.json ]; then
            echo '{"ok":[],"skipped":[],"failed":[{"error":"summary file missing"}]}' > tvdatafeed_summary.json
          fi

          if [ ! -f tvdatafeed_pull.json ]; then
            echo '{"status":"missing","reason":"pull report file missing","expected_count":0,"listed_count":0,"pulled_count":0,"remote_absent_count":0,"copy_missing_count":0,"failed_count":0,"pulled_files":[],"remote_absent_files":[],"copy_missing_files":[],"failed_files":[]}' > tvdatafeed_pull.json
          fi

          python scripts/build_tv_report.py \
            --summary tvdatafeed_summary.json \
            --pull-json tvdatafeed_pull.json \
            --out-md tvdatafeed_report.md \
            --run-year "$RUN_YEAR" \
            --run-date "$RUN_DATE_UTC" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --run-artifacts-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --run-artifact-url "-" \
            --run-at-utc "$RUN_TS_UTC" \
            --run-mode "$RUN_MODE" \
            --run-event-name "$RUN_EVENT_NAME" \
            --run-event-schedule "$RUN_EVENT_SCHEDULE" \
            --run-hour-utc "$RUN_HOUR_UTC" \
            --run-config-path "$EFFECTIVE_CONFIG_PATH"

          echo "===== tvdatafeed_report.md ====="
          sed -n '1,220p' tvdatafeed_report.md

      - name: Push updated tvdatafeed files to Drive (optional)
        if: always() && steps.push_raw.outcome == 'success' && steps.push_range_guard.outcome == 'success'
        run: |
          set -euo pipefail
          if [ "${RCLONE_ENABLED:-0}" != "1" ]; then
            echo "rclone not configured. Skipping push."
            exit 0
          fi

          DATA_ROOT="${{ github.event.inputs.data_root || 'data' }}"
          if [ ! -d "$DATA_ROOT/tradingview" ]; then
            echo "No local tradingview directory. Skipping push."
            exit 0
          fi

          rclone copy "$DATA_ROOT/tradingview" "${RCLONE_REMOTE_PATH%/}/data/tradingview" \
            --include "**/${RUN_YEAR}.parquet" \
            --create-empty-src-dirs \
            -v

      - name: Upload summary artifact
        id: upload_summary
        if: always() && env.RUN_MODE == 'major'
        uses: actions/upload-artifact@v4
        with:
          name: tvdatafeed-summary-${{ env.RUN_STAMP_UTC }}
          path: |
            tvdatafeed_summary.json
            tvdatafeed_pull.json
            tvdatafeed_report.md
          if-no-files-found: ignore

      - name: Enrich report with direct artifact link (major only)
        if: always() && env.RUN_MODE == 'major' && steps.upload_summary.outcome == 'success'
        run: |
          set -euo pipefail
          if [ ! -f tvdatafeed_report.md ]; then
            echo "tvdatafeed_report.md not found. Skipping enrich."
            exit 0
          fi

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          ARTIFACTS_URL="${RUN_URL}/artifacts"
          ARTIFACT_ID="${{ steps.upload_summary.outputs.artifact-id }}"
          ARTIFACT_URL="${{ steps.upload_summary.outputs.artifact-url }}"
          if [ -z "${ARTIFACT_URL:-}" ] && [ -n "${ARTIFACT_ID:-}" ]; then
            ARTIFACT_URL="${RUN_URL}/artifacts/${ARTIFACT_ID}"
          fi
          if [ -z "${ARTIFACT_URL:-}" ]; then
            echo "::error::Upload artifact succeeded but artifact URL is empty."
            exit 1
          fi

          python scripts/build_tv_report.py \
            --summary tvdatafeed_summary.json \
            --pull-json tvdatafeed_pull.json \
            --out-md tvdatafeed_report.md \
            --run-year "$RUN_YEAR" \
            --run-date "$RUN_DATE_UTC" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$RUN_URL" \
            --run-artifacts-url "$ARTIFACTS_URL" \
            --run-artifact-url "$ARTIFACT_URL" \
            --run-at-utc "$RUN_TS_UTC" \
            --run-mode "$RUN_MODE" \
            --run-event-name "$RUN_EVENT_NAME" \
            --run-event-schedule "$RUN_EVENT_SCHEDULE" \
            --run-hour-utc "$RUN_HOUR_UTC" \
            --run-config-path "$EFFECTIVE_CONFIG_PATH"

          grep -q "Run:" tvdatafeed_report.md
          grep -q "Artifacts:" tvdatafeed_report.md
          grep -q "Artifact Download:" tvdatafeed_report.md

      - name: Commit report artifacts to repository (major only)
        if: always() && env.RUN_MODE == 'major' && steps.upload_summary.outcome == 'success'
        run: |
          set -euo pipefail
          if [ ! -f tvdatafeed_report.md ]; then
            echo "tvdatafeed_report.md not found. Skipping repo commit."
            exit 0
          fi

          grep -q "Run:" tvdatafeed_report.md
          grep -q "Artifacts:" tvdatafeed_report.md
          grep -q "Artifact Download:" tvdatafeed_report.md

          REPORT_DIR="artifacts/tvdatafeed"
          REPORT_FILE="$REPORT_DIR/${RUN_STAMP_UTC}.md"
          mkdir -p "$REPORT_DIR"
          cp -f tvdatafeed_report.md "$REPORT_FILE"

          python scripts/update_readme_recent_runs.py \
            --readme README.md \
            --reports-dir "$REPORT_DIR" \
            --repo-base-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --limit 10

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$REPORT_FILE" README.md
          if git diff --cached --quiet; then
            echo "No artifact changes to commit."
            exit 0
          fi

          git commit -m "chore: add tvdatafeed report ${RUN_STAMP_UTC} (run ${GITHUB_RUN_ID})"
          BRANCH="${GITHUB_REF_NAME}"
          for i in 1 2 3; do
            if git pull --rebase origin "$BRANCH" && git push origin "HEAD:${BRANCH}"; then
              exit 0
            fi
            if [ "$i" -eq 3 ]; then
              echo "Failed to push artifact commit after retries."
              exit 1
            fi
            sleep 3
          done
